# Thin caller: publish Player Management ZIP to Underdog Unlimited via shared reusable workflow.
#
# GitHub Environments: production (stable releases) | staging (prereleases + workflow_dispatch)
#
# Secrets (per environment):
#   UU_PUBLISH_TOKEN — same value as PLUGIN_PUBLISH_TOKEN on the Underdog server
# Variables (repository or environment):
#   UU_PUBLISH_URL — override base URL (reusable defaults to https://plugins.underdogunlimited.com)
#
# Note: GitHub Actions does not allow `environment:` on jobs with `uses:` (reusable workflow call).
# This workflow uses separate jobs for staging and production with static environment names,
# and a guard job to enforce the production release constraint.

name: Publish plugin to Underdog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish to staging (e.g. 2.7.20-rc3 or v2.7.20-rc3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Staging: triggered by workflow_dispatch OR prerelease
  publish-staging:
    name: Publish to staging
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'release' && github.event.release.prerelease == true)
    uses: legit-ninja/intersoccer-ci/.github/workflows/publish-plugin.yml@main
    with:
      plugin_slug: player-management
      bootstrap_php: player-management.php
      version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
      changelog: ${{ github.event.release.body || '' }}
      publish_url: ${{ vars.UU_PUBLISH_URL }}
    secrets:
      UU_PUBLISH_TOKEN: ${{ secrets.UU_PUBLISH_TOKEN }}

  # Production guard: ensures target is main or master before production publish
  guard-production:
    name: Guard production release
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.release.prerelease == false
    steps:
      - name: Ensure target is main or master
        run: |
          TARGET="${{ github.event.release.target_commitish }}"
          if [[ "$TARGET" != "main" && "$TARGET" != "master" ]]; then
            echo "::error::Production publishes must target main (got: $TARGET)"
            exit 1
          fi

  # Production: triggered by stable release (not prerelease), after guard passes
  publish-production:
    name: Publish to production
    needs: [guard-production]
    if: github.event_name == 'release' && github.event.release.prerelease == false
    uses: legit-ninja/intersoccer-ci/.github/workflows/publish-plugin.yml@main
    with:
      plugin_slug: player-management
      bootstrap_php: player-management.php
      version: ${{ github.ref_name }}
      changelog: ${{ github.event.release.body || '' }}
      publish_url: ${{ vars.UU_PUBLISH_URL }}
    secrets:
      UU_PUBLISH_TOKEN: ${{ secrets.UU_PUBLISH_TOKEN }}
